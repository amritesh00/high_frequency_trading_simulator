<!DOCTYPE html>
<html>
<head>
    <title>HFT Pro Simulator</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>

<h1>HFT Real-Time Engine</h1>

<div class="container">
    <div class="books">
        <div>
            <h2 class="buy">BIDS (BUY)</h2>
            <ul id="buy"></ul>
        </div>
        <div>
            <h2 class="sell">ASKS (SELL)</h2>
            <ul id="sell"></ul>
        </div>
    </div>

    <div class="trades-panel">
        <h2>RECENT TRADES</h2>
        <ul id="trades"></ul>
    </div>
</div>

<div class="manual">
    <select id="side">
        <option value="buy">BUY</option>
        <option value="sell">SELL</option>
    </select>
    <input id="price" type="number" step="0.01" placeholder="Price">
    <input id="qty" type="number" placeholder="Qty">
    <button onclick="send()">Place Order</button>
</div>

<script>
    const socket = io();
    const tradeList = [];

    socket.on('update', (data) => {
        // Update Orderbook
        document.getElementById('buy').innerHTML = data.book.buy.map(o =>
            `<li><span class="price">${o.price.toFixed(2)}</span> x ${o.qty}</li>`
        ).join("");

        document.getElementById('sell').innerHTML = data.book.sell.map(o =>
            `<li><span class="price">${o.price.toFixed(2)}</span> x ${o.qty}</li>`
        ).join("");

        // Update Trades (Keep last 10)
        if (data.trades && data.trades.length > 0) {
            data.trades.forEach(t => {
                tradeList.unshift(t);
                if (tradeList.length > 10) tradeList.pop();
            });
            
            document.getElementById('trades').innerHTML = tradeList.map(t =>
                `<li class="trade-item">Trade: ${t.price.toFixed(2)} @ ${t.qty} units</li>`
            ).join("");
        }
    });

    function send() {
        socket.emit('manual_order', {
            side: document.getElementById('side').value,
            price: parseFloat(document.getElementById('price').value),
            qty: parseInt(document.getElementById('qty').value)
        });
    }
</script>
</body>
</html>

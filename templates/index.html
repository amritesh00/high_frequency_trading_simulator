<script>
    function refresh() {
        fetch("/orderbook?_=" + Date.now())  // 🔥 prevent caching
            .then(r => r.json())
            .then(d => {
                buy.innerHTML = d.buy.map(o =>
                    `<li>${o.price} × ${o.qty}</li>`
                ).join("");
    
                sell.innerHTML = d.sell.map(o =>
                    `<li>${o.price} × ${o.qty}</li>`
                ).join("");
    
                trades.innerHTML = d.trades.map(t =>
                    `<li>${new Date(t.time*1000).toLocaleTimeString()} | ${t.price} × ${t.qty}</li>`
                ).join("");
            });
    }
    
    setInterval(refresh, 500);
    refresh();
    </script>

<!DOCTYPE html>
<html>
<head>
  <title>HFT Simulator</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <h1>Live Order Book</h1>
  <div id="orderbook">Loading...</div>

  <h2>Place Manual Order</h2>
  <form action="/order" method="POST">
    <select name="type">
      <option value="buy">Buy</option>
      <option value="sell">Sell</option>
    </select>
    <input type="number" step="0.01" name="price" placeholder="Price" required>
    <input type="number" name="qty" placeholder="Quantity" required>
    <button type="submit">Submit</button>
  </form>

  <footer>&copy; Amritesh Bhukhmaria 2025</footer>
  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <script>
    const socket = io();
    socket.on("orderbook_update", loadOrderbook);

    async function loadOrderbook() {
      const res = await fetch("/orderbook");
      const data = await res.json();
      let html = `<table><tr><th>Side</th><th>Price</th><th>Qty</th></tr>`;
      for (let side in data) {
        data[side].forEach(order => {
          html += `<tr><td>${side}</td><td>${order.price}</td><td>${order.qty}</td></tr>`;
        });
      }
      html += '</table>';
      document.getElementById("orderbook").innerHTML = html;
    }

    setInterval(loadOrderbook, 3000);
  </script>
</body>
</html>
